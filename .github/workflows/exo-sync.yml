name: Exo upstream sync

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: exo-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: exo
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Merge upstream/dev, test, and open PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:RUNNER_TEMP 'exo-sync.log'
          if (Test-Path $logFile) { Remove-Item $logFile -Force }

          function Report-Blocked {
            param(
              [string]$Stage,
              [string]$UpstreamSha
            )
            $tail = if (Test-Path $logFile) {
              (Get-Content $logFile -Tail 120) -join "`n"
            } else {
              '(no log captured)'
            }
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $body = @(
              "Automated merge sync of ``upstream/dev`` (``$UpstreamSha``) into ``exo`` failed during **$Stage**."
              "``origin/exo`` was not modified."
              ""
              "Run: $runUrl"
              ""
              "<details>"
              "<summary>Log tail</summary>"
              ""
              '```text'
              $tail
              '```'
              ""
              "</details>"
            ) -join "`n"
            $bodyFile = Join-Path $env:RUNNER_TEMP 'exo-sync-issue.md'
            Set-Content -Path $bodyFile -Value $body -Encoding utf8
            $existing = gh issue list --repo $env:GITHUB_REPOSITORY --state open --search 'in:title "exo sync blocked"' --json number,title --jq '.[] | select(.title == "exo sync blocked") | .number' | Select-Object -First 1
            if ($existing) {
              gh issue edit $existing --repo $env:GITHUB_REPOSITORY --body-file $bodyFile | Out-Null
            } else {
              gh issue create --repo $env:GITHUB_REPOSITORY --title 'exo sync blocked' --body-file $bodyFile | Out-Null
            }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote remove upstream 2>$null
          git remote add upstream https://github.com/anomalyco/rune.git
          git fetch origin exo 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $origExo = (git rev-parse origin/exo).Trim()
          $origShort = (git rev-parse --short origin/exo).Trim()

          git fetch upstream dev 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $upstreamFull = (git rev-parse upstream/dev).Trim()
          $upstreamShort = (git rev-parse --short upstream/dev).Trim()

          git merge-base --is-ancestor $upstreamFull $origExo
          if ($LASTEXITCODE -eq 0) {
            Write-Host "origin/exo ($origShort) already contains upstream/dev ($upstreamShort); nothing to sync."
            exit 0
          }

          $syncBranch = 'sync/upstream-dev'
          Write-Host "Merging upstream/dev ($upstreamShort) into $syncBranch from exo ($origShort)"
          git checkout -B $syncBranch $origExo 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Merge rather than rebase so fork subsystem rewrites on `exo` are never force-rebased away.
          # Generated DX12 bytecode and its hashes conflict whenever upstream and the fork both touch
          # shaders: keep our copy to complete the merge, then regenerate once before testing.
          $generated = '(\.dxbc|dxbc_hash\.rs|dxbc_pinned_hash\.rs|pass_dxbc_hash\.rs)$'
          $env:GIT_EDITOR = 'true'
          $regen = $false
          git merge --no-edit -m "chore(exo): merge upstream/dev ($upstreamShort)" upstream/dev 2>&1 | Tee-Object -FilePath $logFile -Append
          $mergeExit = $LASTEXITCODE
          if ($mergeExit -ne 0) {
            $conflicts = @(git diff --name-only --diff-filter=U)
            $other = @($conflicts | Where-Object { $_ -notmatch $generated })
            if ($conflicts.Count -eq 0 -or $other.Count -gt 0) {
              git status --short 2>&1 | Tee-Object -FilePath $logFile -Append
              git merge --abort 2>$null
              Report-Blocked -Stage 'merge' -UpstreamSha $upstreamShort
              exit 1
            }
            foreach ($f in $conflicts) {
              git checkout --ours -- $f
              git add -- $f
            }
            $regen = $true
            git commit --no-edit 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) {
              git status --short 2>&1 | Tee-Object -FilePath $logFile -Append
              git merge --abort 2>$null
              Report-Blocked -Stage 'merge' -UpstreamSha $upstreamShort
              exit 1
            }
          }
          if ($regen) {
            cargo run --locked -p rune --example regen_dxbc 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) {
              Report-Blocked -Stage 'regen_dxbc' -UpstreamSha $upstreamShort
              exit 1
            }
            git add -A crates
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore(exo): regenerate DX12 uber bytecode after merge of $upstreamShort" 2>&1 | Tee-Object -FilePath $logFile -Append
            }
          }

          # Run Rune's core crate test suite (matching .github/workflows/macos-tests.yml and AGENTS.md).
          # Full `--workspace` pulls in 30+ example binaries, `www/app`, C++ `rune-luau`, and crates
          # (`rune-ref`, `rune-i18n`, `rune-mac`/`rune-notify`) excluded from `Cargo.toml` default-members
          # due to feature unification and build time.
          # Skipped on Windows:
          # - `precompiled_uber_metallib_is_fresh`: requires macOS Xcode (`xcrun metal`) to regenerate
          #   `.metallib` after `shader.wgsl` changes (Windows DXBC freshness still runs).
          # - `select_portal_inside_dialog_accepts_an_option_outside_the_panel`: pre-existing failure
          #   on upstream/dev on Windows.
          # - the five selection reference walks below: upstream/dev 549e0424 already fails them on
          #   Windows (word selection on "row 00" ends at 4 where the reference ends at 3).
          # - `selectable_text::copy_select_all_and_the_context_menu` and the two `markdown_select`
          #   tests below: pre-existing failures on upstream/dev 3d4e2dfc (since 94ed52d0) on
          #   Windows (double-click selects trailing space, e.g. "port "/"cargo "/"def ", while
          #   the assertions still expect the untrimmed word).
          # - `sixty_hud_updates_allocate_nothing_and_keep_the_same_slot`: pre-existing regression
          #   on upstream/dev since ae766fb9 (#1832), which wraps each `Pixels::set` buffer in a
          #   fresh `Arc::new(rgba)` (60 allocations for 60 updates vs expected 0).
          cargo test --locked `
            -p rune-core -p rune-edit -p rune-gpu -p rune-image -p rune-media `
            -p rune-spell -p rune-text -p rune-mermaid `
            -p rune -p rune-kit --features rune-kit/markdown,rune-kit/mermaid `
            -- --skip precompiled_uber_metallib_is_fresh `
               --skip select_portal_inside_dialog_accepts_an_option_outside_the_panel `
               --skip every_short_sequence_of_edits_under_a_selection_leaves_what_dev_left `
               --skip every_short_sequence_of_presses_drags_and_releases_leaves_what_dev_left `
               --skip a_repeated_drag_across_virtual_rows_keeps_the_mounted_row_map `
               --skip every_short_sequence_over_virtual_rows_leaves_what_dev_left `
               --skip every_short_edge_sequence_leaves_what_the_reference_leaves `
               --skip selectable_text::copy_select_all_and_the_context_menu `
               --skip markdown_select::inline_code_copies_without_its_padding `
               --skip markdown_select::highlighted_code_copies_as_plain_text `
               --skip sixty_hud_updates_allocate_nothing_and_keep_the_same_slot `
            2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) {
            Report-Blocked -Stage 'tests' -UpstreamSha $upstreamShort
            exit 1
          }

          $newHead = (git rev-parse HEAD).Trim()

          # Push safety tags (pre-sync snapshot of `exo` and the tested merge candidate) and the PR branch.
          # Never push or force-push directly to `origin/exo`.
          $preTag = "exo-sync-pre-$origShort"
          $existingPreTag = git ls-remote --tags origin "refs/tags/$preTag"
          if (-not $existingPreTag) {
            git tag $preTag $origExo
            git push origin "refs/tags/$preTag" 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          git push --force origin "HEAD:refs/heads/$syncBranch" 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tag = "exo-sync-$upstreamShort"
          $existingTagLine = git ls-remote --tags origin "refs/tags/$tag"
          $existingTagSha = if ($existingTagLine) { ($existingTagLine -split '\s+')[0] } else { '' }
          if ($existingTagSha -ne $newHead) {
            git tag -f $tag $newHead
            git push origin "refs/tags/$tag" --force 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Tag $tag already points to $newHead."
          }

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $prTitle = "chore(exo): sync upstream/dev ($upstreamShort)"
          $prBody = @(
            "Automated weekly merge of ``anomalyco/rune@dev`` (``$upstreamFull``) onto ``exo`` (``$origShort``)."
            ""
            "- Merge commit / candidate: ``$newHead`` (tag ``$tag``)"
            "- Pre-sync ``exo`` safety tag: ``$preTag`` (``$origExo``)"
            "- Windows core crate test suite passed in run: $runUrl"
            ""
            "Review and merge when ready; ``origin/exo`` is never force-rebased."
          ) -join "`n"
          $prBodyFile = Join-Path $env:RUNNER_TEMP 'exo-sync-pr.md'
          Set-Content -Path $prBodyFile -Value $prBody -Encoding utf8

          $existingPr = gh pr list --repo $env:GITHUB_REPOSITORY --state open --head $syncBranch --base exo --json number --jq '.[0].number'
          if ($existingPr) {
            gh pr edit $existingPr --repo $env:GITHUB_REPOSITORY --title $prTitle --body-file $prBodyFile | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $prRef = "#$existingPr"
          } else {
            $prUrl = gh pr create --repo $env:GITHUB_REPOSITORY --base exo --head $syncBranch --title $prTitle --body-file $prBodyFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $prRef = $prUrl
          }

          # Close any previously opened `exo sync blocked` issue once sync succeeds.
          $existing = gh issue list --repo $env:GITHUB_REPOSITORY --state open --search 'in:title "exo sync blocked"' --json number,title --jq '.[] | select(.title == "exo sync blocked") | .number' | Select-Object -First 1
          if ($existing) {
            gh issue close $existing --repo $env:GITHUB_REPOSITORY --comment "Sync PR ready for ``upstream/dev`` (``$upstreamShort``) at tag ``$tag`` ($prRef)." | Out-Null
          }
