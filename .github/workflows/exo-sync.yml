name: Exo upstream sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: exo-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: exo
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rebase onto upstream/dev, test, and push
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:RUNNER_TEMP 'exo-sync.log'
          if (Test-Path $logFile) { Remove-Item $logFile -Force }

          function Report-Blocked {
            param(
              [string]$Stage,
              [string]$UpstreamSha
            )
            $tail = if (Test-Path $logFile) {
              (Get-Content $logFile -Tail 120) -join "`n"
            } else {
              '(no log captured)'
            }
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $body = @(
              "Automated sync of ``exo`` onto ``anomalyco/rune@dev`` (``$UpstreamSha``) failed during **$Stage**."
              "Nothing was pushed to ``origin/exo``."
              ""
              "Run: $runUrl"
              ""
              "<details>"
              "<summary>Log tail</summary>"
              ""
              '```text'
              $tail
              '```'
              ""
              "</details>"
            ) -join "`n"
            $bodyFile = Join-Path $env:RUNNER_TEMP 'exo-sync-issue.md'
            Set-Content -Path $bodyFile -Value $body -Encoding utf8
            $existing = gh issue list --state open --search 'in:title "exo sync blocked"' --json number,title --jq '.[] | select(.title == "exo sync blocked") | .number' | Select-Object -First 1
            if ($existing) {
              gh issue edit $existing --body-file $bodyFile | Out-Null
            } else {
              gh issue create --title 'exo sync blocked' --body-file $bodyFile | Out-Null
            }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote remove upstream 2>$null
          git remote add upstream https://github.com/anomalyco/rune.git
          git fetch origin exo 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $origExo = (git rev-parse origin/exo).Trim()

          git fetch upstream dev 2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $upstreamFull = (git rev-parse upstream/dev).Trim()
          $upstreamShort = (git rev-parse --short upstream/dev).Trim()
          Write-Host "Syncing exo ($origExo) onto upstream/dev ($upstreamShort)"

          # `--empty=drop` (together with git rebase's default patch-id skipping) drops any
          # fork commit whose feature has already landed in upstream/dev.
          # Generated DX12 bytecode and its hashes conflict whenever upstream and a fork commit both
          # touch the shaders: take upstream's copy while rebasing, then regenerate once at the end.
          $generated = '(\.dxbc|dxbc_hash\.rs|dxbc_pinned_hash\.rs|pass_dxbc_hash\.rs)$'
          $env:GIT_EDITOR = 'true'
          $regen = $false
          git rebase --empty=drop upstream/dev 2>&1 | Tee-Object -FilePath $logFile -Append
          $rebaseExit = $LASTEXITCODE
          for ($step = 0; $rebaseExit -ne 0 -and $step -lt 50; $step++) {
            $conflicts = @(git diff --name-only --diff-filter=U)
            $other = @($conflicts | Where-Object { $_ -notmatch $generated })
            if ($conflicts.Count -eq 0 -or $other.Count -gt 0) { break }
            foreach ($f in $conflicts) {
              git checkout --ours -- $f
              git add -- $f
            }
            $regen = $true
            git rebase --continue 2>&1 | Tee-Object -FilePath $logFile -Append
            $rebaseExit = $LASTEXITCODE
          }
          if ($rebaseExit -ne 0) {
            git status --short 2>&1 | Tee-Object -FilePath $logFile -Append
            git rebase --abort 2>$null
            Report-Blocked -Stage 'rebase' -UpstreamSha $upstreamShort
            exit 1
          }
          if ($regen) {
            cargo run --locked -p rune --example regen_dxbc 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) {
              Report-Blocked -Stage 'regen_dxbc' -UpstreamSha $upstreamShort
              exit 1
            }
            git add -A crates
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore(exo): regenerate DX12 uber bytecode after sync onto $upstreamShort" 2>&1 | Tee-Object -FilePath $logFile -Append
            }
          }

          # Run Rune's core crate test suite (matching .github/workflows/macos-tests.yml and AGENTS.md).
          # Full `--workspace` pulls in 30+ example binaries, `www/app`, C++ `rune-luau`, and crates
          # (`rune-ref`, `rune-i18n`, `rune-mac`/`rune-notify`) excluded from `Cargo.toml` default-members
          # due to feature unification and build time.
          # Skipped on Windows:
          # - `precompiled_uber_metallib_is_fresh`: requires macOS Xcode (`xcrun metal`) to regenerate
          #   `.metallib` after `shader.wgsl` changes (Windows DXBC freshness still runs).
          # - `select_portal_inside_dialog_accepts_an_option_outside_the_panel`: pre-existing failure
          #   on upstream/dev on Windows.
          cargo test --locked `
            -p rune-core -p rune-edit -p rune-gpu -p rune-image -p rune-media `
            -p rune-spell -p rune-text -p rune-mermaid `
            -p rune -p rune-kit --features rune-kit/markdown,rune-kit/mermaid `
            -- --skip precompiled_uber_metallib_is_fresh `
               --skip select_portal_inside_dialog_accepts_an_option_outside_the_panel `
            2>&1 | Tee-Object -FilePath $logFile -Append
          if ($LASTEXITCODE -ne 0) {
            Report-Blocked -Stage 'tests' -UpstreamSha $upstreamShort
            exit 1
          }

          $newHead = (git rev-parse HEAD).Trim()
          if ($newHead -ne $origExo) {
            git push "--force-with-lease=refs/heads/exo:$origExo" origin HEAD:exo 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "origin/exo is already at $newHead; no force-push needed."
          }

          $tag = "exo-sync-$upstreamShort"
          $existingTagLine = git ls-remote --tags origin "refs/tags/$tag"
          $existingTagSha = if ($existingTagLine) { ($existingTagLine -split '\s+')[0] } else { '' }
          if ($existingTagSha -ne $newHead) {
            git tag -f $tag $newHead
            git push origin "refs/tags/$tag" --force 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Tag $tag already points to $newHead."
          }

          # Close any previously opened `exo sync blocked` issue once sync succeeds.
          $existing = gh issue list --state open --search 'in:title "exo sync blocked"' --json number,title --jq '.[] | select(.title == "exo sync blocked") | .number' | Select-Object -First 1
          if ($existing) {
            gh issue close $existing --comment "Sync recovered on ``upstream/dev`` (``$upstreamShort``) at tag ``$tag``." | Out-Null
          }
